name: Deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Sync static site to deploy branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git ls-remote --heads origin deploy | grep -q deploy; then
            git fetch origin deploy
            git checkout -f deploy
          else
            git checkout -b deploy
          fi

          # Rebuild from main so deleted pages and data cannot remain deployed.
          git rm -r --ignore-unmatch .
          git clean -fd
          git checkout main -- .
          git add -A

          if git diff --cached --quiet; then
            echo "No site changes to deploy."
          else
            git commit -m "Deploy static site from ${{ github.sha }}"
            git push origin deploy
          fi
